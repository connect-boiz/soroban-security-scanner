name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  NODE_VERSION: '18'
  RUST_VERSION: 'stable'

jobs:
  contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./contracts
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: wasm32v1-none
          components: clippy, rustfmt
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './contracts -> target'
          key: contracts-${{ hashFiles('contracts/Cargo.toml') }}
          shared-key: contracts-cache
      - name: cargo fmt
        run: cargo fmt --check
      - name: cargo clippy
        run: cargo clippy --lib -- -D warnings
      - name: cargo test
        run: cargo test -p security_scanner
      - name: Install stellar-cli (for soroban-sdk 27 wasm build)
        run: |
          curl -fsSL -o /tmp/stellar-cli.tar.gz https://github.com/stellar/stellar-cli/releases/download/v27.1.0/stellar-cli-27.1.0-x86_64-unknown-linux-gnu.tar.gz
          tar -xzf /tmp/stellar-cli.tar.gz -C /tmp
          sudo mv /tmp/stellar /usr/local/bin/stellar
      - name: cargo build (WASM)
        run: stellar contract build

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: backend-${{ hashFiles('Cargo.toml', 'Cargo.lock') }}
          shared-key: backend-cache
      - name: cargo fmt
        run: cargo fmt --check
      - name: cargo check
        run: cargo check --lib
      - name: cargo test
        run: cargo test --lib

  node-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: npm ci
        run: npm ci --no-audit --no-fund
      - name: ESLint
        run: npm run lint
      - name: Prettier
        run: npm run format:check
      - name: Tests
        run: npm test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Build component-library
        working-directory: ./component-library
        run: npm ci --no-audit --no-fund && npm run build
      - name: npm ci
        run: npm ci --no-audit --no-fund
      - name: ESLint
        run: npm run lint
      - name: Tests
        run: npm test
      - name: Production build
        run: npm run build

  component-library:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./component-library
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: component-library/package-lock.json
      - name: npm ci
        run: npm ci --no-audit --no-fund
      - name: ESLint
        run: npm run lint
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
